services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  upstream:
    build: .
    command: uvicorn upstreams.mock_upstream:app --host 0.0.0.0 --port 9001
    ports:
      - "9001:9001"

  gateway:
    build: .
    depends_on:
      - redis
      - mongo
      - upstream
    environment:
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://mongo:27017
      USER_SERVICE_URL: http://upstream:9001
      ORDERS_SERVICE_URL: http://upstream:9001
      RECOMMENDATIONS_SERVICE_URL: http://upstream:9001
      JWT_SECRET: local-dev-secret
    ports:
      - "8000:8000"
