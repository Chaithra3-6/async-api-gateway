name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tooling
        run: pip install -r requirements-security.txt

      - name: Bandit (SAST)
        run: bandit -r app upstreams -f json -o bandit.json || true

      - name: pip-audit (SCA)
        run: pip-audit -r requirements.txt -f json -o pip-audit.json --desc || true

      - name: Gitleaks (secrets)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source=/repo --no-git -f json -r /repo/gitleaks.json --exit-code 0 || true

      - name: Build image
        run: docker build -t gateway:ci .

      - name: Trivy (container scan)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: gateway:ci
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Start gateway
        env:
          JWT_SECRET: ci-dast-secret
        run: |
          pip install -r requirements.txt
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done

      - name: DAST scan
        run: python security/dast_scanner.py http://127.0.0.1:8000 -o dast-report.json --delay 0

      - name: Aggregate findings
        run: |
          python security/aggregate.py \
            --bandit bandit.json \
            --pip-audit pip-audit.json \
            --gitleaks gitleaks.json \
            --trivy trivy.json \
            --dast dast-report.json \
            --out-json security-report.json \
            --out-html security-report.html \
            --fail-on NONE

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            security-report.json
            security-report.html
            bandit.json
            pip-audit.json
            gitleaks.json
            trivy.json
            dast-report.json
          retention-days: 14
